# Merge these lifecycle hooks into ~/.codex/config.toml.
notify = ["python3", "/home/oscar/repos_cloned/wezterm_config/bin/codex-wezterm-notify"]

[tui]
# Keep approval alerts; the external notifier handles turn completion.
notifications = ["approval-requested"]

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "wezterm-agent-state running"

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = "wezterm-agent-state running"

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "wezterm-agent-state attention"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "wezterm-agent-state completed"
